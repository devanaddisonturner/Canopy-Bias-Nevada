# ---------------------------------------------------------------------------
# Devan Cantrell Addison-Turner, ORCID 0000-0002-2511-3680
# Department of Civil and Environmental Engineering, Stanford University
#
# From the reproduction package for "An optically independent administrative
# reference for validating built-surface products, and the tree-canopy bias it
# reveals", a manuscript prepared for GIScience & Remote Sensing. Not yet
# published; cite the repository until it is. Citation metadata: CITATION.cff.
#
# https://github.com/devanaddisonturner/Canopy-Bias-Nevada
# Code MIT, released data CC0 1.0.
# ---------------------------------------------------------------------------
# Runs the three gates on every push and pull request.
#
# The package's central claim is that 522 assertions reproduce every table,
# figure and quoted value from the released data. A claim like that is worth
# more when a machine other than the author's re-checks it on every commit,
# which is what this does.
#
# poppler-utils is needed because two checks read the rendered PDF: the layout
# checks, and the rendered-against-source check that catches a document rebuilt
# without being reconverted.
#
# Node is deliberately NOT installed. It is needed only to rebuild the
# manuscript .docx, never to verify a number.

name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # Pinned rather than ubuntu-latest. On 30 September 2026 a run under
    # ubuntu-latest failed on 3.11 and 3.13 and passed on 3.12, which no Python
    # difference explains; GitHub was mid-migration of that label and the jobs
    # did not all land on the same image. A package whose claim is exact
    # reproduction should name its environment rather than let it drift.
    runs-on: ubuntu-24.04
    # The README claims Python 3.11 or newer. Running all three keeps that claim
    # true rather than true on the day it was written. 3.10 is deliberately
    # absent: pandas 3.0 declares Requires-Python >=3.11, so it cannot install.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # fonts-liberation is not optional. Every figure script asks for
      # Liberation Serif, metric-compatible with the manuscript's Times New
      # Roman, and falls back to DejaVu Serif when it is absent. The fallback is
      # silent and it moves every glyph: forcing it changes 701,620 of Figure 1's
      # 13,246,905 pixels, which is enough for embedded_figures_are_current() to
      # call the manuscript's embedded figure stale. That is what failed here on
      # 30 September 2026, and it had never been seen locally because LibreOffice
      # installs this font as a dependency.
      - name: Install poppler-utils and the Liberation fonts
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-liberation

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Numeric harness
        run: python3 make_tables.py

      - name: Layout checks
        run: python3 check_layout.py

      - name: Colour-vision checks
        run: python3 check_colours.py

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Independent R reimplementation
        run: Rscript verify_in_r.R

      - name: Harness self-test
        run: python3 test_harness.py

      # Regenerating the figures and re-running the harness proves the figure
      # scripts still produce the shipped images. If a matplotlib upgrade moved
      # a pixel, embedded_figures_are_current() fails here rather than silently
      # in someone's reuse. Last runs as it overwrites the figure files.
      - name: Figures regenerate identically
        run: |
          python3 make_figure_studyarea.py
          python3 make_figure_schematic.py
          python3 make_figure_matched_parcels.py
          python3 make_figure_divergence.py
          python3 make_graphical_abstract.py
          python3 make_tables.py

      # Diagnostic, added 30 September 2026. The regenerated Figure 1 matches
      # the embedded copy on 3.12 and not on 3.11 or 3.13, and it matches under
      # all three interpreters on the author's machine, so nothing about Python
      # explains it. Three hypotheses were proposed and all three were wrong: a
      # missing wheel, GitHub's ubuntu-latest migration, and a missing Liberation
      # Serif. This prints what actually differs. Remove it once that is known.
      - name: Diagnose the figure difference
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import io, zipfile
          import numpy as np
          from PIL import Image
          import matplotlib, PIL, numpy
          from matplotlib import font_manager
          Image.MAX_IMAGE_PIXELS = None
          disk = Image.open('figure_studyarea.png').convert('RGB')
          print('on disk :', disk.size)
          z = zipfile.ZipFile('canopy_bias_manuscript_GIScienceRS.docx')
          a = np.asarray(disk, dtype=int)
          for n in z.namelist():
              if not (n.startswith('word/media/') and n.lower().endswith('.png')):
                  continue
              im = Image.open(io.BytesIO(z.read(n))).convert('RGB')
              if im.size != disk.size:
                  continue
              d = np.abs(np.asarray(im, dtype=int) - a)
              m = d.sum(axis=2) > 0
              print('%s: %d of %d pixels differ, max channel diff %d'
                    % (n, int(m.sum()), a.shape[0] * a.shape[1], int(d.max())))
              if m.any():
                  ys, xs = np.where(m)
                  print('   bbox  x %d-%d   y %d-%d' % (xs.min(), xs.max(), ys.min(), ys.max()))
          print('matplotlib', matplotlib.__version__)
          print('pillow', PIL.__version__, 'numpy', numpy.__version__)
          print('serif resolves to:', font_manager.findfont(
              font_manager.FontProperties(family=['Liberation Serif', 'DejaVu Serif'])))
          PY
